name: preview

# PR → <APP>-pr-<no>.ozgurl.uk ; mantık kalıpta (_preview.yml). Bu dosya miras, düzenleme.
on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    uses: ozgurl-uk/kalip/.github/workflows/_preview.yml@v1
    secrets: inherit
    permissions:
      contents: read
