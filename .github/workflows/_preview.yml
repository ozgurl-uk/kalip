name: _preview

# Merkezi iş akışı (workflow_call). Tetikleyici ve izinler app'teki preview.yml'de.
# PR → <APP>-pr-<no>.ozgurl.uk ; PR kapanınca silinir.
on:
  workflow_call:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ozgurl-uk/kalip/.github/actions/setup@v1
      - name: version.txt artırıldı mı? (sadece main'e PR)
        if: github.base_ref == 'main'
        run: |
          v="v$(cat version.txt)"
          git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null 2>&1 && { echo "::error file=version.txt::$v zaten yayınlanmış; version.txt'i artır"; exit 1; } || true
      - run: bun run deploy
      - name: özet
        run: |
          bun -e 'import { HOST } from "./.ozgurluk/config.ts"; console.log("Preview: https://" + HOST)' >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ozgurl-uk/kalip/.github/actions/setup@v1
      - run: |
          name="$(bun -e 'import { WORKER } from "./.ozgurluk/config.ts"; console.log(WORKER)')"
          # PR'ın deploy'u hiç olmadıysa Worker yoktur; cleanup yine yeşil bitsin.
          bunx cf workers delete "$name" --force || true
